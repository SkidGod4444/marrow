# Production on the EC2 box: RDS Postgres + real S3 via .env, Caddy terminates HTTPS for the subdomain.
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  server:
    build: { context: ., dockerfile: docker/server.Dockerfile }
    env_file: [.env]
    environment:
      STORAGE_DRIVER: s3
      WORK_DIR: /data/work
    volumes: [workdata:/data]
    restart: unless-stopped
    expose: ["3001"]

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    environment:
      MARROW_API_URL: http://server:3001
      MARROW_API_KEY: ${MARROW_API_KEY}
    depends_on: [server]
    restart: unless-stopped
    expose: ["3000"]

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      MARROW_DOMAIN: ${MARROW_DOMAIN}
    depends_on: [web, server]
    restart: unless-stopped

volumes:
  workdata:
  caddydata:
  caddyconfig:
