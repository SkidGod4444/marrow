# Production on the EC2 box: the Marrow server (REST + MCP + pipeline) behind Caddy (automatic HTTPS) on the
# API subdomain. The web app is deployed separately on Vercel and talks to this API over HTTPS.
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  server:
    build: { context: ., dockerfile: docker/server.Dockerfile }
    env_file: [.env]
    environment:
      STORAGE_DRIVER: s3
      WORK_DIR: /data/work
    volumes: [workdata:/data]
    restart: unless-stopped
    expose: ["3001"]

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      MARROW_API_DOMAIN: ${MARROW_API_DOMAIN}
    depends_on: [server]
    restart: unless-stopped

volumes:
  workdata:
  caddydata:
  caddyconfig:
