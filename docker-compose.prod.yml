# Production on the EC2 box: the Marrow server (REST + MCP + pipeline) behind Caddy (automatic HTTPS) on the
# API subdomain. The web app is deployed separately on Vercel and talks to this API over HTTPS.
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      args: { GIT_SHA: "${GIT_SHA:-unknown}" } # baked into the image; GET /health reports it
    env_file: [.env]
    environment:
      STORAGE_DRIVER: s3
      WORK_DIR: /data/work
      YTDLP_POT_PROVIDER_URL: http://pot-provider:4416 # PO tokens for YouTube (see the service below)
    volumes:
      - workdata:/data
      - ./secrets:/secrets:ro # yt-dlp works on a private copy per run; the owner's file is never rewritten (docs/DEPLOY.md)
    restart: unless-stopped
    # A deploy replaces the container: give the server time to finish the stage it is on (it waits up to 90 s for
    # in-flight jobs); anything still unfinished is re-queued when the new container boots.
    stop_grace_period: 100s
    expose: ["3001"]
    depends_on: [pot-provider]

  # Proof-of-origin tokens for YouTube (bgutil): with cookies alone, cloud addresses still trip the "not a bot" check now and
  # then; tokened requests look legitimate. Small Node service, only reachable from the server container.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    expose: ["4416"]

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      MARROW_API_DOMAIN: ${MARROW_API_DOMAIN}
    depends_on: [server]
    restart: unless-stopped

volumes:
  workdata:
  caddydata:
  caddyconfig:
