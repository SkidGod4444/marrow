<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body style="margin:24px auto;box-shadow:0 0 0 1px #2d2d2d">
    <header class="top">
      <img src="../icons/48.png" alt="" class="mark" />
      <span class="brand">Marrow</span>
      <span id="who" class="who"></span>
      <button id="gear" class="quiet" title="Settings" hidden>Settings</button>
    </header>

    <!-- 1. first run: one key -->
    <section id="setup" class="view" hidden>
      <p class="eyebrow">( connect )</p>
      <h1 class="h">Paste an API key.</h1>
      <p class="lede">Create one in Marrow under <b>Settings → API keys</b>, then paste it here. That's all it needs.</p>
      <div class="field">
        <input id="key" type="password" placeholder="mrw_…" spellcheck="false" autocomplete="off" />
      </div>
      <div class="row">
        <button id="connect" class="key primary">Connect</button>
        <a id="openKeys" href="#" class="link">Open Settings ↗</a>
      </div>
      <p id="setupNote" class="note"></p>
    </section>

    <!-- 2. connected -->
    <section id="main" class="view" hidden>
      <div class="card">
        <p class="eyebrow" id="kind">( this tab )</p>
        <p id="title" class="title">—</p>
        <p id="preview" class="preview" hidden></p>
        <div class="row" id="addRow">
          <select id="namespace" class="select" aria-label="Namespace"></select>
          <button id="go" class="key primary">Add</button>
        </div>
        <p id="addNote" class="note"></p>
      </div>

    </section>

    <!-- 3. settings -->
    <section id="settings" class="view" hidden>
      <p class="eyebrow">( settings )</p>
      <label class="field">API key<input id="key2" type="password" placeholder="mrw_…" spellcheck="false" autocomplete="off" /></label>
      <details class="adv">
        <summary>Advanced</summary>
        <label class="field">API address<input id="apiUrl" type="url" spellcheck="false" /></label>
        <label class="field">Web app address<input id="webUrl" type="url" spellcheck="false" /></label>
        <div class="row">
          <button id="reset" class="quiet">Reset addresses</button>
          <button id="force" class="quiet">Send YouTube session now</button>
          <span id="forceNote" class="note"></span>
        </div>
      </details>
      <div class="row">
        <button id="save" class="key primary">Save</button>
        <button id="back" class="quiet">Back</button>
        <span id="settingsNote" class="note"></span>
      </div>
    </section>

    <script src="shim.js"></script>
    <script type="module" src="../popup.js"></script>
  </body>
</html>
